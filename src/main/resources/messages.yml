# MultiDimensionRTP Messages
# All user-facing messages - supports MiniMessage format
# Placeholders: {dimension}, {seconds}, {attempts}, {cooldown}, {prefix}
# This file auto-updates when messages-version increases (old file kept as messages.yml.bak)
messages-version: 3

# Global prefix for all plugin messages
prefix: "<gradient:#00FF88:#00FFFF><bold>RTP</bold></gradient> <dark_gray>»</dark_gray> "

# Command messages
command:
  no-permission: "<red>You don't have permission to use this command."
  player-only: "<red>This command can only be used by players."
  cooldown: "<red>Please wait <yellow>{seconds}</yellow> second(s) before using RTP again."
  reloaded: "<green>Configuration reloaded successfully!"

# Dialog messages
dialog:
  title: "<gold><bold>Random Teleport</bold></gold>"
  body: "<gray>Select a dimension to teleport to.</gray>"

  # Dimension selector input (keep these SHORT - shown in the bottom selector)
  dimension-label: "<yellow>Dimension</yellow>"
  dimensions:
    overworld: "<green>Overworld</green>"
    nether: "<red>Nether</red>"
    end: "<aqua>The End</aqua>"

  # Confirmation buttons
  confirm-button: "<green><bold>Confirm</bold></green>"
  confirm-tooltip: "<gray>Teleport to the selected dimension</gray>"
  cancel-button: "<red><bold>Cancel</bold></red>"
  cancel-tooltip: "<gray>Close without teleporting</gray>"

  # Item display in body (keep these SHORT - one line each)
  item-descriptions:
    overworld: "<green>Overworld</green> <gray>- surface spawn</gray>"
    nether: "<red>Nether</red> <gray>- air pockets</gray>"
    end: "<aqua>The End</aqua> <gray>- end stone islands</gray>"

# Process messages
process:
  searching: "<yellow>Searching for safe location in <gradient:#00FF88:#00FFFF>{dimension}</gradient>... <dark_gray>(attempt {attempt}/{max})</dark_gray>"
  found: "<green>Found safe location! Teleporting...</green>"
  failed: "<red>Could not find a safe location after <yellow>{attempts}</yellow> attempts. Please try again."
  cancelled: "<red>Teleport cancelled."

# Result messages
result:
  success: "<green>Successfully teleported to <gradient:#00FF88:#00FFFF>{dimension}</gradient>!"
  failed-generic: "<red>Teleport failed. Please try again later."

# Error messages
error:
  world-not-found: "<red>World <yellow>{world}</yellow> not found!"
  no-world-access: "<red>Cannot access <yellow>{dimension}</yellow> dimension."
  internal-error: "<red>An internal error occurred. Please contact an administrator."

# Staff teleport messages
stafftp:
  player-not-found: "<red>Player <yellow>{target}</yellow> not found."
  teleported: "<green>Teleported to <yellow>{target}</yellow> <gray>(gamemode kept: {gamemode})</gray>"
  failed: "<red>Could not teleport to <yellow>{target}</yellow>."